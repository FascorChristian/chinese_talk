services:
  - type: web
    name: chinese-talk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SCRIPT_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SCRIPT_API_TOKEN
        sync: false


